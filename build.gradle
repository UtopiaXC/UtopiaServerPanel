plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id 'com.gradleup.shadow' version '9.0.0-beta12'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Shadow configuration for embedding netty-codec-http into the mod JAR.
// NeoForge's JPMS module system blocks loading netty-codec-http as a separate JAR,
// so we relocate it into our namespace to make it part of the mod's own module.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    shade
}

repositories {
    mavenCentral()
}

dependencies {
    // netty-codec-http: provides HttpServerCodec, HttpObjectAggregator, WebSocketServerProtocolHandler
    // 'shade' = embed into final JAR via shadow plugin (relocated to avoid JPMS split-package)
    // 'implementation' = compile time
    // 'additionalRuntimeClasspath' = dev mode (MC 1.21.1 needs this for non-mod libs)
    shade('io.netty:netty-codec-http:4.1.97.Final') { transitive = false }
    implementation 'io.netty:netty-codec-http:4.1.97.Final'
    additionalRuntimeClasspath 'io.netty:netty-codec-http:4.1.97.Final'

    // oshi-core: provides system information (CPU, memory, disk)
    // NeoForge 1.21.1 already strictly includes OSHI 6.4.10, so we use compileOnly to compile against it
    // without shading it or conflicting with NeoForge's strictly enforced version.
    compileOnly 'com.github.oshi:oshi-core:6.4.10'

    // SQLite JDBC: embedded database for user/auth data
    shade 'org.xerial:sqlite-jdbc:3.45.3.0'
    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'
    additionalRuntimeClasspath 'org.xerial:sqlite-jdbc:3.45.3.0'

    // JWT (jjwt): JSON Web Token for stateless authentication
    shade 'io.jsonwebtoken:jjwt-api:0.12.6'
    shade 'io.jsonwebtoken:jjwt-impl:0.12.6'
    shade 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    additionalRuntimeClasspath 'io.jsonwebtoken:jjwt-api:0.12.6'
    additionalRuntimeClasspath 'io.jsonwebtoken:jjwt-impl:0.12.6'
    additionalRuntimeClasspath 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // jBCrypt: password hashing
    shade 'org.mindrot:jbcrypt:0.4'
    implementation 'org.mindrot:jbcrypt:0.4'
    additionalRuntimeClasspath 'org.mindrot:jbcrypt:0.4'

    // MyBatis: persistence layer
    shade 'org.mybatis:mybatis:3.5.16'
    implementation 'org.mybatis:mybatis:3.5.16'
    additionalRuntimeClasspath 'org.mybatis:mybatis:3.5.16'
}

// Shadow: merge shaded deps into the mod JAR with package relocation
shadowJar {
    configurations = [project.configurations.shade]
    archiveClassifier = ''
    archiveBaseName = base.archivesName

    // Relocate to avoid JPMS split-package with MC's built-in Netty modules
    relocate 'io.netty.handler.codec.http', 'com.utopiaxc.utopiaserverpanel.shaded.netty.http'
    relocate 'org.sqlite', 'com.utopiaxc.utopiaserverpanel.shaded.sqlite'
    relocate 'io.jsonwebtoken', 'com.utopiaxc.utopiaserverpanel.shaded.jjwt'
    relocate 'org.mindrot.jbcrypt', 'com.utopiaxc.utopiaserverpanel.shaded.jbcrypt'
    relocate 'org.apache.ibatis', 'com.utopiaxc.utopiaserverpanel.shaded.ibatis'
}

// Make shadowJar run after jar, and replace the default jar artifact
tasks.named('jar') {
    archiveClassifier = 'slim'
}
tasks.named('shadowJar') {
    dependsOn 'jar'
}
tasks.build.dependsOn shadowJar

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

import org.apache.tools.ant.taskdefs.condition.Os

task buildWeb(type: Exec) {
    workingDir = file('web')
    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        commandLine 'cmd', '/c', 'npm install && npm run build'
    } else {
        commandLine 'sh', '-c', 'npm install && npm run build'
    }
}

task syncWeb(type: Sync) {
    dependsOn buildWeb
    from 'web/dist'
    into 'src/main/resources/web'
}

processResources.dependsOn syncWeb

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}