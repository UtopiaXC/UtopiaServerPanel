name: Release
run-name: Release ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom Tag (e.g. v1.0.0)'
        required: false
        default: ''
      push:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: true
      publish_curseforge:
        description: 'Publish to CurseForge'
        required: true
        type: boolean
        default: true
      curseforge_dry_run:
        description: 'CurseForge Dry Run (validate metadata without uploading)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve Version & Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      note_file: ${{ steps.resolve.outputs.note_file }}
      legacy_matrix: ${{ steps.matrix.outputs.legacy_matrix }}
      modern_matrix: ${{ steps.matrix.outputs.modern_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version and Note
        id: resolve
        shell: bash
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "$INPUT_TAG_NAME" ]; then
            TAG="$INPUT_TAG_NAME"
          fi
          cleanVersion="${TAG#v}"
          cleanVersion="${cleanVersion%+*}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${cleanVersion}" >> "$GITHUB_OUTPUT"

          notePathWithV="assets/release_note/${TAG}.md"
          notePathWithoutV="assets/release_note/${cleanVersion}.md"

          if [ -f "$notePathWithV" ]; then
            echo "note_file=$notePathWithV" >> "$GITHUB_OUTPUT"
          elif [ -f "$notePathWithoutV" ]; then
            echo "note_file=$notePathWithoutV" >> "$GITHUB_OUTPUT"
          else
            echo "note_file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Emit Build Matrices
        id: matrix
        shell: bash
        run: python3 scripts/ci_helpers.py emit-matrices

  build-frontend:
    name: Build Web Frontend
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install & Build Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Upload Frontend Bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  build-legacy:
    name: Build Legacy (${{ matrix.mc }} ${{ matrix.loader }})
    needs: [version, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.version.outputs.legacy_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Frontend Bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Setup Target Toolchain JDK (${{ matrix.jdk }})
        if: matrix.jdk != matrix.gradle_jdk
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'temurin'

      - name: Setup Gradle Runtime JDK (${{ matrix.gradle_jdk }})
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.gradle_jdk }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.loader }} ${{ matrix.mc }}
        run: |
          chmod +x ./gradlew
          ./gradlew -p "${{ matrix.project_dir }}" build --no-daemon -PskipWeb=true -Pmod_version=${{ needs.version.outputs.version }}

      - name: Collect Release Artifact
        shell: bash
        run: |
          mkdir -p dist_release
          JAR_NAME="UtopiaServerPanel-${{ needs.version.outputs.version }}-mc${{ matrix.mc }}-${{ matrix.loader }}.jar"
          SRC_JAR="${{ matrix.project_dir }}/build/libs/${JAR_NAME}"
          test -f "$SRC_JAR"
          cp "$SRC_JAR" "dist_release/${JAR_NAME}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar-${{ matrix.mc }}-${{ matrix.loader }}
          path: dist_release/*.jar
          retention-days: 7
          if-no-files-found: error

  build-modern:
    name: Build ${{ matrix.mc }} (${{ matrix.loader }})
    needs: [version, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        include: ${{ fromJson(needs.version.outputs.modern_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Frontend Bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Setup Target Toolchain JDK (${{ matrix.jdk }})
        if: matrix.jdk != matrix.gradle_jdk
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'temurin'

      - name: Setup Gradle Runtime JDK (${{ matrix.gradle_jdk }})
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.gradle_jdk }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.loader }} ${{ matrix.mc }}
        run: |
          chmod +x ./gradlew
          ./gradlew -p "${{ matrix.project_dir }}" build --no-daemon -PskipWeb=true -Ptarget_mc=${{ matrix.mc }} -Pmod_version=${{ needs.version.outputs.version }}

      - name: Collect Release Artifact
        shell: bash
        run: |
          mkdir -p dist_release
          JAR_NAME="UtopiaServerPanel-${{ needs.version.outputs.version }}-mc${{ matrix.mc }}-${{ matrix.loader }}.jar"
          SRC_JAR="${{ matrix.project_dir }}/build/libs/${JAR_NAME}"
          test -f "$SRC_JAR"
          cp "$SRC_JAR" "dist_release/${JAR_NAME}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar-${{ matrix.mc }}-${{ matrix.loader }}
          path: dist_release/*.jar
          retention-days: 7
          if-no-files-found: error

  publish-release:
    name: Create GitHub Release
    needs: [version, build-legacy, build-modern]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.push != false)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Built Mod JARs
        uses: actions/download-artifact@v4
        with:
          pattern: mod-jar-*
          path: dist_release
          merge-multiple: true

      - name: Render Release Body & Verify Size Limits
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          NOTE_FILE: ${{ needs.version.outputs.note_file }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python3 scripts/ci_helpers.py render-release-body \
            --tag "$TAG" \
            --version "$VERSION" \
            --note "$NOTE_FILE" \
            --artifacts-dir dist_release \
            --repo "$REPO" \
            --server-url "$SERVER_URL" \
            --output release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: UtopiaServerPanel ${{ needs.version.outputs.tag }}
          tag_name: ${{ needs.version.outputs.tag }}
          body_path: release_body.md
          files: dist_release/*.jar
          draft: false
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-curseforge:
    name: Publish to CurseForge
    needs: [version, build-legacy, build-modern]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.publish_curseforge != false)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check CurseForge Credentials
        id: cf_check
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN || secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID || vars.CURSEFORGE_PROJECT_ID }}
          DRY_RUN: ${{ inputs.curseforge_dry_run == true }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_PROJECT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## CurseForge Distribution Skipped"
              echo ""
              echo "Configure repository Secret \`CURSEFORGE_API_TOKEN\` (or \`CURSEFORGE_TOKEN\`) and Variable/Secret \`CURSEFORGE_PROJECT_ID\` to enable CurseForge uploads."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "CurseForge credentials not configured; skipping upload."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download Built Mod JARs
        if: steps.cf_check.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: mod-jar-*
          path: dist_release
          merge-multiple: true

      - name: Upload Artifacts to CurseForge
        if: steps.cf_check.outputs.ready == 'true'
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN || secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID || vars.CURSEFORGE_PROJECT_ID }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          NOTE_FILE: ${{ needs.version.outputs.note_file }}
          DRY_RUN: ${{ inputs.curseforge_dry_run == true }}
        run: |
          ARGS=(
            --project-id "${CF_PROJECT_ID:-0}"
            --token "$CF_TOKEN"
            --tag "$TAG"
            --version "$VERSION"
            --note "$NOTE_FILE"
            --artifacts-dir dist_release
          )
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python3 scripts/ci_helpers.py publish-curseforge "${ARGS[@]}"

