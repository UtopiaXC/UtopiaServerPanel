import groovy.json.JsonSlurper

ext.loadVersionTarget = { File repoRoot, String mcVersion ->
    def json = new JsonSlurper().parse(new File(repoRoot, 'versions.json'))
    def found = json.baselines.find { it.mc == mcVersion }
    if (found == null) {
        throw new GradleException("Unknown target_mc '${mcVersion}' in versions.json")
    }
    return [manifest: json, target: found]
}

ext.parseMcTuple = { String ver ->
    def clean = ver.split('[-+]')[0]
    def parts = clean.tokenize('.')
    int major = parts.size() > 0 ? parts[0].toInteger() : 0
    int minor = parts.size() > 1 ? parts[1].toInteger() : 0
    int patch = parts.size() > 2 ? parts[2].toInteger() : 0
    return [major, minor, patch]
}

ext.compareMcTuple = { List<Integer> a, List<Integer> b ->
    for (int i = 0; i < 3; i++) {
        int cmp = Integer.compare(a[i], b[i])
        if (cmp != 0) return cmp
    }
    return 0
}

ext.evalPreprocExpr = { String expr, String mcVersion, String loader ->
    def mcTuple = parseMcTuple(mcVersion)
    def evalAtom = { String raw ->
        def atom = raw.trim()
        if (atom.startsWith('!')) {
            return !evalAtom(atom.substring(1).trim())
        }
        def loaderEq = (atom =~ /^loader\s*==\s*'([^']+)'$/)
        if (loaderEq.matches()) {
            return loader == loaderEq.group(1)
        }
        def loaderNe = (atom =~ /^loader\s*!=\s*'([^']+)'$/)
        if (loaderNe.matches()) {
            return loader != loaderNe.group(1)
        }
        def mcCmp = (atom =~ /^mc\s*(>=|<=|==|!=|>|<)\s*([0-9]+(?:\.[0-9]+)*)$/)
        if (mcCmp.matches()) {
            def op = mcCmp.group(1)
            def rhs = parseMcTuple(mcCmp.group(2))
            int c = compareMcTuple(mcTuple, rhs)
            switch (op) {
                case '>=': return c >= 0
                case '<=': return c <= 0
                case '==': return c == 0
                case '!=': return c != 0
                case '>':  return c > 0
                case '<':  return c < 0
            }
        }
        throw new GradleException("Unsupported preprocessor condition: '${atom}'")
    }

    // Support '||' and '&&' precedence cleanly
    def orBranches = expr.split(/\|\|/)
    for (String orPart : orBranches) {
        boolean andResult = true
        for (String andPart : orPart.split(/&&/)) {
            if (!evalAtom(andPart)) {
                andResult = false
                break
            }
        }
        if (andResult) return true
    }
    return false
}

ext.preprocessTrees = { List<File> srcDirs, File outDir, String mcVersion, String loader ->
    if (outDir.exists()) {
        outDir.deleteDir()
    }
    outDir.mkdirs()

    for (File srcDir : srcDirs) {
        if (srcDir == null || !srcDir.exists()) {
            continue
        }

        srcDir.eachFileRecurse { File f ->
            if (!f.isFile()) return
            def relPath = srcDir.toPath().relativize(f.toPath()).toString()
            def dest = new File(outDir, relPath)
            dest.parentFile.mkdirs()

            if (!f.name.endsWith('.java')) {
                dest.bytes = f.bytes
                return
            }

            def lines = f.readLines('UTF-8')
            def stack = [] // list of [parentActive: boolean, branchMatched: boolean, currentActive: boolean]
            def out = new ArrayList<String>(lines.size())

            for (int idx = 0; idx < lines.size(); idx++) {
                String line = lines[idx]
                String trimmed = line.trim()

                if (trimmed.startsWith('//? if ')) {
                    String expr = trimmed.substring('//? if '.length())
                    if (!expr.endsWith('{')) {
                        throw new GradleException("${f}:${idx + 1}: '//? if ...' must end with '{'")
                    }
                    expr = expr.substring(0, expr.length() - 1).trim()
                    boolean parentActive = stack.isEmpty() ? true : stack.last().currentActive
                    boolean cond = parentActive && evalPreprocExpr(expr, mcVersion, loader)
                    stack.add([parentActive: parentActive, branchMatched: cond, currentActive: cond])
                    out.add(line)
                } else if (trimmed.startsWith('//?} else if ')) {
                    if (stack.isEmpty()) {
                        throw new GradleException("${f}:${idx + 1}: unmatched '//?} else if'")
                    }
                    String expr = trimmed.substring('//?} else if '.length())
                    if (!expr.endsWith('{')) {
                        throw new GradleException("${f}:${idx + 1}: '//?} else if ...' must end with '{'")
                    }
                    expr = expr.substring(0, expr.length() - 1).trim()
                    def top = stack.last()
                    boolean cond = top.parentActive && !top.branchMatched && evalPreprocExpr(expr, mcVersion, loader)
                    top.branchMatched = top.branchMatched || cond
                    top.currentActive = cond
                    out.add(line)
                } else if (trimmed == '//?} else {') {
                    if (stack.isEmpty()) {
                        throw new GradleException("${f}:${idx + 1}: unmatched '//?} else {'")
                    }
                    def top = stack.last()
                    boolean cond = top.parentActive && !top.branchMatched
                    top.branchMatched = true
                    top.currentActive = cond
                    out.add(line)
                } else if (trimmed == '//?}') {
                    if (stack.isEmpty()) {
                        throw new GradleException("${f}:${idx + 1}: unmatched '//?}'")
                    }
                    stack.remove(stack.size() - 1)
                    out.add(line)
                } else {
                    boolean active = stack.isEmpty() ? true : stack.last().currentActive
                    out.add(active ? line : "// [USP-PREPROC] " + line)
                }
            }

            if (!stack.isEmpty()) {
                throw new GradleException("${f}: unclosed '//? if' block(s)")
            }

            dest.setText(out.join('\n') + '\n', 'UTF-8')
        }
    }
}

ext.preprocessTree = { File srcDir, File outDir, String mcVersion, String loader ->
    preprocessTrees([srcDir], outDir, mcVersion, loader)
}
