pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'usp_platform_fabric'

includeBuild('../..') {
    dependencySubstitution {
        substitute module('com.utopiaxc.utopiaserverpanel:core') using project(':core')
        substitute module('com.utopiaxc.utopiaserverpanel:bridge-modern-jvm') using project(':bridge:modern-jvm')
    }
}

