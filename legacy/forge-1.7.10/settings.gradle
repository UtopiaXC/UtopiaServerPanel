pluginManagement {
    repositories {
        maven {
            name = 'GTNH Maven'
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'usp_legacy_1_7_10'

includeBuild('../..') {
    dependencySubstitution {
        substitute module('com.utopiaxc.utopiaserverpanel:core') using project(':core')
    }
}

